name: i18n Playwright Tests

on:
  push:
    branches: [master]
    paths:
      - 'web/src/**'
      - 'web/tests/**'
      - 'web/package.json'
      - 'web/playwright.config.ts'
      - '.github/workflows/playwright-i18n.yml'
  pull_request:
    paths:
      - 'web/src/**'
      - 'web/tests/**'
      - 'web/package.json'
      - 'web/playwright.config.ts'
      - '.github/workflows/playwright-i18n.yml'

jobs:
  i18n-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install chromium --with-deps

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt -q

      - name: Install ML pipeline dependencies (algorithm tests)
        working-directory: backend
        run: pip install -r ../ml_pipeline/requirements.txt -q

      - name: Run Django checks and algorithm tests
        working-directory: backend
        run: |
          python manage.py check
          cd "$GITHUB_WORKSPACE"
          python -m pytest bridge_algorithm_service/tests -q

      - name: Start Django backend
        working-directory: backend
        run: |
          python manage.py runserver 0.0.0.0:8000 &
          # Wait for backend to be ready
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/login/ > /dev/null 2>&1; then
              echo "Backend is ready"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Backend failed to start"
              exit 1
            fi
            sleep 1
          done

      - name: Run Playwright i18n tests
        working-directory: web
        run: npx playwright test --reporter=list --project=chromium --workers=1
        env:
          CI: 'true'
          TEST_ADMIN_USER: admin
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: web/test-results/
          retention-days: 14
