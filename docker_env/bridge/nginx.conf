server {
    listen 6000;
    server_name _;
    client_max_body_size 100M;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        if ($request_uri ~* "^/$|^/index.html|^/index.htm") {
            add_header Cache-Control "no-store";
        }
    }

    location /assets/ {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 600s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        rewrite ^/api/api/(.*)$ /api/$1 break;
        proxy_pass http://bridge-backend:8002;
    }

    # 消息中心 SSE：保持长连接，事件流按心跳维持
    location /sse/ {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 600s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 600s;
        proxy_pass http://bridge-backend:8002;
    }

    # 消息中心 WebSocket：需要 Upgrade 头
    location /ws/ {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 600s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 600s;
        proxy_pass http://bridge-backend:8002;
    }

    location /bridge-api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 600s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        rewrite ^/bridge-api/(.*)$ /$1 break;
        proxy_pass http://bridge-algorithm:8001/;
    }

    location /media/ {
        alias /backend/media/;
        expires 7d;
    }
}
